esphome:
  name: ti-cc27xx

external_components:
  - source: github://Fox-Red-Labs/esphome-ti
    components: [cc27xx, die_temperature, ti_adc, ti_pwm]
  # working from a checkout instead? use:  - source: {type: local, path: ../components}

cc27xx:
  board: LP_EM_CC2755P10
  # probe_serial: XXXXXXXX     # your debug probe's serial (`xdsdfu -e` lists it), or pass --device <serial> to upload

logger:
  level: DEBUG

preferences:
  flash_write_interval: 60s   # settings are written to the board's flash (TI NVS driver) this often

zigbee:
  router: true
  model: "TI cc27xx"

switch:
  - platform: gpio
    name: "LED"
    pin: DIO16
    restore_mode: ALWAYS_OFF

sensor:
  - platform: die_temperature
    name: "Chip temperature"
    update_interval: 30s
